[project]
name = "fairway"
version = "0.1.0"
description = "Backend library for the Agent Chat Protocol: durable streaming agent chat over FastAPI + SQLite"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
