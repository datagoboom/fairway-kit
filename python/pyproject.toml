[project]
name = "fairway-kit"
version = "0.2.1"
description = "Dev kit backend for local agent-backed apps: durable, resumable agent chat over FastAPI + SQLite"
license = "MIT"
readme = "README.md"
authors = [{ name = "Andrew Long" }]
requires-python = ">=3.12"
keywords = ["agent", "chat", "sse", "streaming", "claude", "llm", "fastapi", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.2"]

[project.urls]
Homepage = "https://github.com/datagoboom/fairway-kit"
Repository = "https://github.com/datagoboom/fairway-kit"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
