name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: python }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: js }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: js/package-lock.json }
      - run: npm ci
      - run: npx vitest run          # includes the shared fold conformance vectors
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm run build           # the publishable artifact must build

  example:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: examples/chat/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            examples/chat/web/package-lock.json
            js/package-lock.json
      # The example consumes the lib from source via aliases, so the lib's
      # deps (react types, react-markdown) must be installed too.
      - run: npm ci --prefix ../../../js
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
