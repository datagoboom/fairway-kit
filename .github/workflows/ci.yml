name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: python }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fairway
          POSTGRES_DB: fairway
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: fairway
          MYSQL_DATABASE: fairway
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pfairway"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      # The backend conformance suite runs against these when set; unset, it
      # falls back to SQLite-only (so local runs need no services).
      FAIRWAY_TEST_POSTGRES_URL: postgresql://postgres:fairway@localhost:5432/fairway
      FAIRWAY_TEST_MYSQL_URL: mysql://root:fairway@localhost:3306/fairway
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --extra postgres --extra mysql
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: js }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: js/package-lock.json }
      - run: npm ci                   # installs all workspace packages (builds better-sqlite3)
      - run: npm run build            # protocol, agent, client, server; publishable artifacts must build
      - run: npm test                 # all packages; includes the shared fold conformance vectors
      - run: npm run typecheck
      # Recipes are copy-paste adapters, not shipped — but CI-guarded so they
      # don't rot: typecheck against the frameworks' real types, run mapping tests.
      - run: npm run typecheck -w fairway-recipes
      - run: npm test -w fairway-recipes

  node-backends:
    # The Node server's Postgres/MySQL backends against real databases. The fast
    # `frontend` job covers SQLite; this one adds the networked dialects (pg and
    # mysql2 are devDependencies, so `npm ci` installs them).
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: js }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fairway
          POSTGRES_DB: fairway
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: fairway
          MYSQL_DATABASE: fairway
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pfairway"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      FAIRWAY_TEST_POSTGRES_URL: postgresql://postgres:fairway@localhost:5432/fairway
      FAIRWAY_TEST_MYSQL_URL: mysql://root:fairway@localhost:3306/fairway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: js/package-lock.json }
      - run: npm ci
      - run: npm run build -w @fairway-kit/protocol   # server tests import built protocol
      - run: npm test -w @fairway-kit/server          # backend conformance hits pg + mysql

  example:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: examples/chat/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            examples/chat/web/package-lock.json
            examples/chat/server/package-lock.json
            js/package-lock.json
      # The example consumes the lib from source via aliases, so the lib's
      # deps (react types, react-markdown, better-sqlite3) must be installed too.
      - run: npm ci --prefix ../../../js
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit          # web
      - name: typecheck node server (consumes @fairway-kit/{server,agent} from source)
        working-directory: examples/chat/server
        run: |
          npm ci
          npx tsc -p tsconfig.json --noEmit
