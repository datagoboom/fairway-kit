name: release

# Publishes both packages when a v* tag is pushed. No stored secrets:
# PyPI uses OIDC trusted publishing; npm uses OIDC trusted publishing after
# the first (manual) publish. See RELEASING.md for the one-time setup.

on:
  push:
    tags: ["v*"]

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match both package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY=$(grep -m1 '^version = ' python/pyproject.toml | cut -d'"' -f2)
          JS=$(node -p "require('./js/package.json').version")
          echo "tag=$TAG python=$PY js=$JS"
          [ "$TAG" = "$PY" ] && [ "$TAG" = "$JS" ] || { echo "version mismatch"; exit 1; }

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: python }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync
      - run: uv run pytest -q

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: js }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc -p tsconfig.json --noEmit

  publish-pypi:
    needs: [check-versions, test-backend, test-frontend]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing — no token
    defaults:
      run: { working-directory: python }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  publish-npm:
    needs: [check-versions, test-backend, test-frontend]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # OIDC trusted publishing (after first manual publish)
      contents: read
    defaults:
      run: { working-directory: js }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm publish
