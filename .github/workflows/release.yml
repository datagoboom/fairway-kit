name: release

# Package-prefixed tags. Each package versions independently and releases on its
# own tag, so there is no shared version namespace to collide in:
#
#   js-v<version>      -> @fairway-kit/protocol + @fairway-kit/client (released together)
#   agent-v<version>   -> @fairway-kit/agent
#   server-v<version>  -> @fairway-kit/server
#   py-v<version>      -> fairway-kit on PyPI
#
# The tag's version must equal the matching package's declared version, or the
# run fails fast. No stored secrets: PyPI and npm both use OIDC trusted
# publishing. See docs/RELEASING.md (local) for the one-time setup.

on:
  push:
    tags:
      - "js-v*"
      - "agent-v*"
      - "server-v*"
      - "py-v*"

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      publish_js: ${{ steps.check.outputs.publish_js }}
      publish_agent: ${{ steps.check.outputs.publish_agent }}
      publish_server: ${{ steps.check.outputs.publish_server }}
      publish_py: ${{ steps.check.outputs.publish_py }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Decide which package this tag releases
        run: |
          KIND="${GITHUB_REF_NAME%%-v*}"   # js | agent | server | py
          VER="${GITHUB_REF_NAME#*-v}"     # 0.2.0
          PY=$(grep -m1 '^version = ' python/pyproject.toml | cut -d'"' -f2)
          PROTO=$(node -p "require('./js/packages/protocol/package.json').version")
          CLIENT=$(node -p "require('./js/packages/client/package.json').version")
          AGENT=$(node -p "require('./js/packages/agent/package.json').version")
          SERVER=$(node -p "require('./js/packages/server/package.json').version")
          echo "kind=$KIND ver=$VER python=$PY protocol=$PROTO client=$CLIENT agent=$AGENT server=$SERVER"
          # Default everything off; the matching branch turns exactly one on and
          # asserts the tag version equals the package's declared version.
          echo "publish_js=false" >> "$GITHUB_OUTPUT"
          echo "publish_agent=false" >> "$GITHUB_OUTPUT"
          echo "publish_server=false" >> "$GITHUB_OUTPUT"
          echo "publish_py=false" >> "$GITHUB_OUTPUT"
          case "$KIND" in
            js)
              # protocol + client release together (client depends on protocol
              # at an exact version), so both must equal the tag.
              [ "$PROTO" = "$VER" ] && [ "$CLIENT" = "$VER" ] || {
                echo "js-v$VER but protocol=$PROTO client=$CLIENT" >&2; exit 1; }
              echo "publish_js=true" >> "$GITHUB_OUTPUT" ;;
            agent)
              [ "$AGENT" = "$VER" ] || { echo "agent-v$VER but agent=$AGENT" >&2; exit 1; }
              echo "publish_agent=true" >> "$GITHUB_OUTPUT" ;;
            server)
              [ "$SERVER" = "$VER" ] || { echo "server-v$VER but server=$SERVER" >&2; exit 1; }
              echo "publish_server=true" >> "$GITHUB_OUTPUT" ;;
            py)
              [ "$PY" = "$VER" ] || { echo "py-v$VER but python=$PY" >&2; exit 1; }
              echo "publish_py=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "unrecognized tag $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: python }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync
      - run: uv run pytest -q

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: js }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck

  publish-pypi:
    needs: [versions, test-backend, test-frontend]
    if: needs.versions.outputs.publish_py == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing, no token
      contents: read    # a permissions block zeroes everything unlisted; checkout needs this
    defaults:
      run: { working-directory: python }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  publish-npm:
    needs: [versions, test-backend, test-frontend]
    if: needs.versions.outputs.publish_js == 'true' || needs.versions.outputs.publish_agent == 'true' || needs.versions.outputs.publish_server == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # OIDC trusted publishing (after each package's first manual publish)
      contents: read
    defaults:
      run: { working-directory: js }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      # Dependency order: protocol -> agent -> client/server (client depends on
      # protocol; server depends on protocol + agent).
      - run: npm publish -w @fairway-kit/protocol
        if: needs.versions.outputs.publish_js == 'true'
      - run: npm publish -w @fairway-kit/agent
        if: needs.versions.outputs.publish_agent == 'true'
      - run: npm publish -w @fairway-kit/client
        if: needs.versions.outputs.publish_js == 'true'
      - run: npm publish -w @fairway-kit/server
        if: needs.versions.outputs.publish_server == 'true'
