name: release

# On a v* tag, publishes whichever packages match the tag version. No stored
# secrets: PyPI and npm both use OIDC trusted publishing. The Python and JS
# sides version independently — a tag publishes the JS packages when they match
# it and PyPI when python matches, so a JS-only release skips PyPI and vice
# versa. See docs/RELEASING.md (local) for the one-time trusted-publisher setup.

on:
  push:
    tags: ["v*"]

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      publish_js: ${{ steps.check.outputs.publish_js }}
      publish_agent: ${{ steps.check.outputs.publish_agent }}
      publish_server: ${{ steps.check.outputs.publish_server }}
      publish_py: ${{ steps.check.outputs.publish_py }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Decide which packages this tag releases
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY=$(grep -m1 '^version = ' python/pyproject.toml | cut -d'"' -f2)
          PROTO=$(node -p "require('./js/packages/protocol/package.json').version")
          CLIENT=$(node -p "require('./js/packages/client/package.json').version")
          AGENT=$(node -p "require('./js/packages/agent/package.json').version")
          SERVER=$(node -p "require('./js/packages/server/package.json').version")
          echo "tag=$TAG python=$PY protocol=$PROTO client=$CLIENT agent=$AGENT server=$SERVER"
          # protocol + client release together and must share the tag version
          # (client depends on protocol at an exact version). agent and server
          # version independently, each releasing on its own matching tag.
          if [ "$PROTO" = "$TAG" ] && [ "$CLIENT" = "$TAG" ]; then
            echo "publish_js=true" >> "$GITHUB_OUTPUT"
          elif [ "$PROTO" = "$TAG" ] || [ "$CLIENT" = "$TAG" ]; then
            echo "JS packages disagree with the tag" >&2; exit 1
          else
            echo "publish_js=false" >> "$GITHUB_OUTPUT"
          fi
          echo "publish_agent=$([ "$AGENT" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "publish_server=$([ "$SERVER" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "publish_py=$([ "$PY" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: python }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync
      - run: uv run pytest -q

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: js }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck

  publish-pypi:
    needs: [versions, test-backend, test-frontend]
    if: needs.versions.outputs.publish_py == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing, no token
      contents: read    # a permissions block zeroes everything unlisted; checkout needs this
    defaults:
      run: { working-directory: python }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  publish-npm:
    needs: [versions, test-backend, test-frontend]
    if: needs.versions.outputs.publish_js == 'true' || needs.versions.outputs.publish_agent == 'true' || needs.versions.outputs.publish_server == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # OIDC trusted publishing (after each package's first manual publish)
      contents: read
    defaults:
      run: { working-directory: js }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      # Dependency order: protocol -> agent -> client/server (client depends on
      # protocol; server depends on protocol + agent).
      - run: npm publish -w @fairway-kit/protocol
        if: needs.versions.outputs.publish_js == 'true'
      - run: npm publish -w @fairway-kit/agent
        if: needs.versions.outputs.publish_agent == 'true'
      - run: npm publish -w @fairway-kit/client
        if: needs.versions.outputs.publish_js == 'true'
      - run: npm publish -w @fairway-kit/server
        if: needs.versions.outputs.publish_server == 'true'
