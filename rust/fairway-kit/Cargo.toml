[package]
name = "fairway-kit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust implementation of the fairway Agent Chat Protocol: event log, job registry, runner interface, and axum router for local agent-backed apps"
repository = "https://github.com/datagoboom/fairway-kit"
keywords = ["agent", "chat", "sse", "streaming", "local-first"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

[dev-dependencies.tower-http]
version = "0.6"
features = ["cors"]
